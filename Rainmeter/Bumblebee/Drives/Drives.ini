;----------
[DriveHeight]
Measure=Calc
Formula=22+#Height1#+#Height2#+#Height3#+#Height4#+#Height5#+#Height6#
OnChangeAction=[!UpdateMeter *][!Redraw]
DynamicVariables=1

[DriveHead]
Meter=Shape
Shape=Line 0,0,275,0 | Stroke Color #Color2#,255 | StrokeWidth 2
X=0
Y=0

[DriveBg]
Meter=Shape
Shape=Rectangle 0,5,275,[DriveHeight] | Extend DriveBgFill | StrokeWidth 0
DriveBgFill=Fill Color #BackGround#
MouseOverAction=[!SetOption DriveBg DriveBgFill "Fill Color #HoverGround#"][!UpdateMeter DriveBg][!Redraw]
MouseLeaveAction=[!SetOption DriveBg DriveBgFill "Fill Color #BackGround#"][!UpdateMeter DriveBg][!Redraw]
DynamicVariables=1
X=r
Y=r

[Drive1Letter]
Meter=String
MeasureName=MeasureDriveLetter1
MeterStyle=TextStyle1
FontSize=15
Group=D1
X=5r
Y=20r

[Drive1Bar]
Meter=Bar
MeasureName=MeasureDiskUsed1
BarOrientation=Horizontal
BarColor=#Color2#
SolidColor=80,80,80,100
Group=D1
X=20r
y=2r
W=240
H=18

[Drive1Used]
Meter=String
MeasureName=MeasureDiskUsed1
MeasureName2=MeasureDiskSize1
Text=%1 / %2
MeterStyle=BarText
FontSize=12
Group=D1
AutoScale=1
X=10r
Y=r

[Drive1Free]
Meter=String
MeasureName=MeasureDiskFree1
MeterStyle=BarText
FontSize=12
AutoScale=1
StringAlign=Right
Group=D1
H=30
X=220r
Y=r

