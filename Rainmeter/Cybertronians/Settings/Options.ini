[RainMeter]
Update=100
DefaultUpdateDivider=2

[Metadata]
Name=Autobots Rainmeter Skin
Author=Rajnoor Brar
License=Creative Commons Attribution-NonCommercial Share-Alike 4.0 International

[Background1]
Meter=Shape
Shape= Rectangle 0,0,50,500 | Fill Color 20,20,20,150 | Stroke Color 0,0,0,240 | StrokeWidth 2
Shape2=Rectangle 50,0,650,500 | Fill Color 10,10,10,248 | Stroke Color 0,0,0,255 | StrokeWidth 2
Shape3=Line 665,55,85,55 | Stroke Color 255,255,255,245

[Variables]
IncludeSet=General
Config=#@#Config.inc
RainRGB=#@#Addons\RainRGB\RainRGB4.exe
Rainfile=#@#Addons\RainFile\RainFile.exe
@include=#Config#
@include2=#IncludeSet#.inc
Tooltip=Double Click to Edit a Setting, or Change the Tabs.

[HeadStyle]
StringStyle=NORMAL
StringAlign=Center
FontFace=Autobus
FontSize=25
AntiAlias=1

[SubHead]
StringStyle=NORMAL
FontFace=Autobus
FontSize=16
FontColor=245,245,245
FontWeight=700
AntiAlias=1

[SubTitle]
StringStyle=NORMAL
FontFace=Autobus
FontColor=245,245,245
FontSize=13
FontWeight=700
AntiAlias=1

[TextStyle]
StringStyle=NORMAL
FontFace=Autobus
FontColor=245,245,245
FontSize=12
AntiAlias=1

[CommentStyle]
StringStyle=NORMAL
FontFace=Ariel Narrow
FontColor=245,245,245
FontSize=8
AntiAlias=1

[GeneralSets]
Meter=Image
ImageName=#@#\Images\Base.png
ImageTint=#GeneralTint#
SolidColor=#GeneralBg#
MouseOverAction=[!Setoption GeneralSets Solidcolor "#GeneralHover#"][!Setoption Tooltip Text "Change General Settings common among skins."]
MouseLeaveAction=[!Setoption GeneralSets Solidcolor "#GeneralBg#"]
LeftMouseDoubleClickAction=[!WriteKeyValue Variables IncludeSet "General"][!Refresh]
X=0
Y=0

[AutoSets]
Meter=Image
ImageName=#@#\Images\botIco.png
ImageTint=#AutoTint#
SolidColor=#AutoBg#
MouseOverAction=[!Setoption AutoSets Solidcolor "#AutoHover#"][!Setoption Tooltip Text "Change Autobot specific Settings"]
MouseLeaveAction=[!Setoption AutoSets Solidcolor "#AutoBg#"][!Setoption Tooltip Text "#ToolTip#"]
LeftMouseDoubleClickAction=[!WriteKeyValue Variables IncludeSet "Autobot"][!Refresh]
X=r
Y=R

[DeceptiSets]
Meter=Image
ImageName=#@#\Images\conIco.png
ImageTint=#DeceptiTint#
SolidColor=#DeceptiBg#
MouseOverAction=[!Setoption DeceptiSets Solidcolor "#DeceptiHover#"][!Setoption Tooltip Text "Change Decepticon Specific Settings"]
MouseLeaveAction=[!Setoption DeceptiSets Solidcolor "#DeceptiBg#"][!Setoption Tooltip Text "#ToolTip#"]
LeftMouseDoubleClickAction=[!WriteKeyValue Variables IncludeSet "Decepticon"][!Refresh]
X=r
Y=R

[MusicSets]
Meter=Image
ImageName=#@#\Images\musicIco.png
ImageTint=#MusicTint#
SolidColor=#MusicBg#
MouseOverAction=[!Setoption musicSets Solidcolor "#MusicHover#"][!Setoption Tooltip Text "Music Player Settings"]
MouseLeaveAction=[!Setoption musicSets Solidcolor "#MusicBg#"][!Setoption Tooltip Text "#ToolTip#"]
LeftMouseDoubleClickAction=[!WriteKeyValue Variables IncludeSet "Music"][!Refresh]
X=r
Y=R

[LaunchSets]
Meter=Image
ImageName=#@#\Images\launchIco.png
ImageTint=#LaunchTint#
SolidColor=#LaunchBg#
MouseOverAction=[!Setoption LaunchSets Solidcolor "#LaunchHover#"][!Setoption Tooltip Text "Launcher Settings."]
MouseLeaveAction=[!Setoption LaunchSets Solidcolor "#LaunchBg#"][!Setoption Tooltip Text "#ToolTip#"]
LeftMouseDoubleClickAction=[!WriteKeyValue Variables IncludeSet "Launchers"][!Refresh]
X=r
Y=R

[ToolTip]
Meter=String
MeterStyle=CommentStyle
StringAlign=LeftBottom
Text=#ToolTip#
X=60
Y=490
W=600
H=40
ClipString=1

[CommandCenter]
Measure=PLUGIN
Plugin=InputText.dll
h=25
w=150
Solidcolor= 50, 50, 50, 255
FontFace=Arial Narrow
FontColor=245,245,245
FontSize=12
AntiAlias=1
FocusDismiss=1
Command1=[!WriteKeyValue Variables Drive1 "$UserInput$" "#Config#"] [!Refresh] x=205 y=137 DefaultValue="#Drive1#"
Command2=[!WriteKeyValue Variables Drive1Name "$UserInput$" "#Config#"] [!Refresh] x=200 y=110 DefaultValue="#Drive1Name#"
Command3=[!WriteKeyValue Variables Drive2 "$UserInput$" "#Config#"] [!Refresh] x=210 y=252 DefaultValue="#Drive2#"
Command4=[!WriteKeyValue Variables Drive2Name "$UserInput$" "#Config#"] [!Refresh] x=205 y=225 DefaultValue="#Drive2Name#"
Command5=[!WriteKeyValue Variables Drive3 "$UserInput$" "#Config#"] [!Refresh] x=210 y=367 DefaultValue="#Drive3#"
Command6=[!WriteKeyValue Variables Drive3Name "$UserInput$" "#Config#"] [!Refresh] x=205 y=340 DefaultValue="#Drive3Name#"
Command7=[!WriteKeyValue Variables Font1 "$UserInput$" "#Config#"] [!Refresh] x=495 y=110 DefaultValue="#Font1#"
Command8=[!WriteKeyValue Variables Font2 "$UserInput$" "#Config#"] [!Refresh] x=500 y=142 DefaultValue="#Font2#"
Command9=[!WriteKeyValue Variables PlDe "$UserInput$" "#Config#"] [!Refresh] x=183 y=132 DefaultValue="#PlDe#"
Command10=[!WriteKeyValue Variables PlSe "$UserInput$" "#Config#"] [!Refresh] x=487 y=132 DefaultValue="#PlSe#"
Command11=[!WriteKeyValue Variables LaunchName1 "$UserInput$" "#Config#"] [!Refresh] x=150 y=113 DefaultValue="#LaunchName1#" w=210 StringAlign=right
Command12=[!WriteKeyValue Variables LaunchPath1 "$UserInput$" "#Config#"] [!Refresh] x=400 y=113 DefaultValue="#LaunchPath1#" w=210
Command13=[!WriteKeyValue Variables LaunchName2 "$UserInput$" "#Config#"] [!Refresh] x=150 y=152 DefaultValue="#LaunchName2#" w=210 StringAlign=right
Command14=[!WriteKeyValue Variables LaunchPath2 "$UserInput$" "#Config#"] [!Refresh] x=400 y=152 DefaultValue="#LaunchPath2#" w=210
Command15=[!WriteKeyValue Variables LaunchName3 "$UserInput$" "#Config#"] [!Refresh] x=150 y=191 DefaultValue="#LaunchName3#" w=210 StringAlign=right
Command16=[!WriteKeyValue Variables LaunchPath3 "$UserInput$" "#Config#"] [!Refresh] x=400 y=191 DefaultValue="#LaunchPath3#" w=210
Command17=[!WriteKeyValue Variables LaunchName4 "$UserInput$" "#Config#"] [!Refresh] x=150 y=230 DefaultValue="#LaunchName4#" w=210 StringAlign=right
Command18=[!WriteKeyValue Variables LaunchPath4 "$UserInput$" "#Config#"] [!Refresh] x=400 y=230 DefaultValue="#LaunchPath4#" w=210
Command19=[!WriteKeyValue Variables LaunchName5 "$UserInput$" "#Config#"] [!Refresh] x=150 y=269 DefaultValue="#LaunchName5#" w=210 StringAlign=right
Command20=[!WriteKeyValue Variables LaunchPath5 "$UserInput$" "#Config#"] [!Refresh] x=400 y=269 DefaultValue="#LaunchPath5#" w=210
Command21=[!WriteKeyValue Variables LaunchName6 "$UserInput$" "#Config#"] [!Refresh] x=150 y=308 DefaultValue="#LaunchName6#" w=210 StringAlign=right
Command22=[!WriteKeyValue Variables LaunchPath6 "$UserInput$" "#Config#"] [!Refresh] x=400 y=308 DefaultValue="#LaunchPath6#" w=210

[Close]
Meter=Image
ImageName=#@#\Images\powerIco.png
ImageTint=250,250,250
SolidColor=0,0,0,100
MouseOverAction=[!Setoption Close Solidcolor "0,0,0,250"][!Setoption Tooltip Text "Close the Skin."]
MouseLeaveAction=[!Setoption Close Solidcolor "0,0,0,100"][!Setoption Tooltip Text "#ToolTip#"]
LeftMouseDoubleClickAction=[!DeactivateConfig]
X=0
Y=460

[Refresh]
Meter=Image
ImageName=#@#\Images\refreshIco.png
ImageTint=250,250,250
SolidColor=0,0,0,100
MouseOverAction=[!Setoption Refresh Solidcolor "0,0,0,250"][!Setoption Tooltip Text "Refresh All Skins to the Changes."]
MouseLeaveAction=[!Setoption Refresh Solidcolor "0,0,0,100"][!Setoption Tooltip Text "#ToolTip#"]
LeftMouseDoubleClickAction=[!Refresh *]
X=0
Y=420
