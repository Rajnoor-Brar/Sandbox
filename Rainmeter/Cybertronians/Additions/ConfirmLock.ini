[Rainmeter]
Update=100
Blur=1
BlurRegion=1,0,0,#workareawidth#,#workareaheight#,#blurcornerradius#
OnRefreshAction=[!RainmeterZPos 2]
RightMouseUpAction=[""]
RightMouseDownAction=[""]
RightMouseDoubleClickAction=[""]

[Variables]
Color1=255,255,255
Color2=0,78,255
Color3=230,0,0
Title=Lock_Comp
Execute=[rundll32.exe user32.dll LockWorkStation]

[TextStyle1]
FontColor=#Color1#,255
FontEffectColor=#Color1#,80
StringEffect=BORDER
StringStyle=NORMAL
FontFace=SteelWolf
AntiAlias=1

[TextStyle2]
FontColor=#Color3#,255
StringEffect=NONE
StringStyle=NORMAL
FontFace=SteelWolf
AntiAlias=1

[MeterBG0]
Meter=Image
BackgroundMode=1
SolidColor=0,0,0,220
W=#workareawidth#
H=#workareaheight#
X=0
Y=0

[PowBg]
Meter=Image
ImageName=#@#Images\powbg.png
X=((#workareawidth#/2)-(603/2))
Y=((#workareaheight#/2)-(393/2))
ImageTint=#Color3#,245

[Bg01]
Meter=IMAGE
ImageName=#@#Images\files\bg01c.png
ImageTint=#Color1#
X=400r
Y=160r

[Bg02]
Meter=IMAGE
ImageName=#@#Images\files\bg01b.png
ImageTint=#Color3#
X=-230r
Y=-20r

[Title]
Meter=String
MeterStyle=TextStyle1
FontSize=35
StringAlign=Right
X=220r
Y=-50r
Text="_#Title#"

[Text1]
Meter=String
MeterStyle=TextStyle1
FontSize=9
StringEffect=NONE
StringAlign=Right
X=-150r
Y=55r
Text="_The Action Will Be#CRLF#_Taken Automatically In"

[Count00]
Measure=Calc
Formula=Count00%11+1
IfAboveValue=9
IfAboveAction=[!SetOption Text2 Text SEC]
IfEqualValue=11
IfEqualAction=[!DisableMeasure Count00][!DisableMeasure Count00b][!Deactivateconfig]#Execute#
UpdateDivider=10

[Count00b]
Measure=Calc
Formula=(11-Count00)
UpdateDivider=10

[CountText]
Meter=String
MeterStyle=TextStyle1
FontSize=55
StringAlign=Right
X=100r
Y=-15r
Text=[Count00b]
NumOfDecimals=2"
DynamicVariables=1

[Text2]
Meter=String
MeterStyle=TextStyle1
FontSize=9
StringEffect=NONE
StringAlign=Left
X=-2r
Y=50r
Text="SECS"

[Box1]
Meter=IMAGE
SolidColor=#Color3#,160
W=140
H=40
X=-310r
Y=50r
MouseOverAction=[!SetOption Proceed MeterStyle TextStyle2][!SetOption Box1 SolidColor #Color1#,250][!ShowMeterGroup T1][PLAY #@#01.WAV]
MouseLeaveAction=[!SetOption Proceed MeterStyle TextStyle1][!SetOption Box1 SolidColor #Color3#,160][!HideMeterGroup T1]
LeftMouseDownAction=[!Deactivateconfig]#Execute#[PLAY #@#02.WAV]

[Box2]
Meter=IMAGE
SolidColor=#Color3#,160
W=140
H=40
X=50r
Y=45r
MouseOverAction=[!SetOption Cancel MeterStyle TextStyle2][!SetOption Box2 SolidColor #Color1#,250][!ShowMeterGroup T2][PLAY #@#01.WAV]
MouseLeaveAction=[!SetOption Cancel MeterStyle TextStyle1][!SetOption Box2 SolidColor #Color3#,160][!HideMeterGroup T2]
LeftMouseDownAction=[!Deactivateconfig][PLAY #@#02.WAV]

[Proceed]
Meter=String
MeterStyle=TextStyle1
FontSize=15
StringAlign=Center
X=20r
Y=-35r
Text="Proceed"

[Cancel]
Meter=String
MeterStyle=TextStyle1
FontSize=15
StringAlign=Center
X=50r
Y=45r
Text="Cancel"

[CountD]
Measure=Calc
Formula=Counter % 2
DynamicVariables=1
UpdateDivider=3

[TargBox1]
Meter=Image
ImageName=#@#Images\files\targ01.png
X=-98r
Y=-85r
ImageTint=#Color2#
Group=T1
Hidden=1

[DimTarget1]
Meter=IMAGE
ImageName=#@#Images\files\dim\[CountD].png
ImageTint=#Color3#,255
X=70r
Y=10r
DynamicVariables=1
Group=T1
Hidden=1

[TargBox2]
Meter=Image
ImageName=#@#Images\files\targ01.png
X=-20r
Y=36r
ImageTint=#Color2#
Group=T2
Hidden=1

[DimTarget2]
Meter=IMAGE
ImageName=#@#Images\files\dim\[CountD].png
ImageTint=#Color3#,255
X=70r
Y=10r
DynamicVariables=1
Group=T2
Hidden=1

[ScanTargH1]
Meter=Image
W=#workareawidth#
H=1
X=0
Y=((#workareaheight#/2)+52)
SolidColor=0,0,0,1
SolidColor2=#Color2#,250
GradientAngle=45.0
Group=T1
Hidden=1

[ScanTargH2]
Meter=Image
W=#workareawidth#
H=1
X=0
Y=((#workareaheight#/2)+96)
SolidColor=0,0,0,1
SolidColor2=#Color2#,250
GradientAngle=45.0
Group=T2
Hidden=1

[ScanTargV1]
Meter=Image
W=1
H=#workareaheight#
X=((#workareawidth#/2)-205)
Y=0
SolidColor=0,0,0,1
SolidColor2=#Color2#,250
GradientAngle=45.0
Group=T1
Hidden=1

[ScanTargV2]
Meter=Image
W=1
H=#workareaheight#
X=((#workareawidth#/2)-155)
Y=0
SolidColor=0,0,0,1
SolidColor2=#Color2#,250
GradientAngle=45.0
Group=T2
Hidden=1