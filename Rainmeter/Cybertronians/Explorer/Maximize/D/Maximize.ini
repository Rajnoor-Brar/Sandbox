[Rainmeter]
Author=RSB

[Meter]
Meter=String
FontFace=SF Transrobotics
FontColor=255,255,255
Solidcolor=0,0,0,1
StringAlign=Left
FontSize=15
X=1230
AntiAlias=1
Text=Maximize
LeftMouseUpAction=[!DeactivateConfig][!SetTransparency "255" "Cybertronians\Explorer\D"][!ClickThrough "0" "Cybertronians\Explorer\D"]
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "50,50,255,150"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor ""][!UpdateMeter #CURRENTSECTION#][!Redraw]