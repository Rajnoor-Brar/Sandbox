[Rainmeter]
Update=100
DefaultUpdateDivider=20
AccurateText=1

[Metadata]
Name=Bumblebee
Author=SparkShredder
Information=Shows Stats of Upto 4 Drives : Used\Total---Free | Automatically detects available drive letters|Drive letters can be assigned manually in Variables
Version=1.0
License=Creative Commons Attribution-NonCommercial Share-Alike 4.0 International

;----------Variables

@include=#@#Variables.inc

;----------Meter-Styles

@include2=#@#Styles.inc

;----------Skin

@include3=DriveLetters#Letters#.inc

;-------Disk--Info

